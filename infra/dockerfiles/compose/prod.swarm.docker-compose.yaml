version: '3.8'

services:
  # Nazwa serwisu w Swarmie to {stack}_{service} -> arturscibor_frontend_frontend
  frontend:
    # Obraz to sam nginx z gotowymi statykami — URL backendu jest wpieczony
    # w bundlu na etapie builda (src/app.ts). Zero env w runtime.
    image: ${FRONTEND_IMAGE:-arturscibor/arturscibor_frontend:latest}
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        # Traefik już działa na VPS (osobno od tego stacka) — front tylko
        # podpina się pod istniejącą sieć traefik-public
        - "traefik.enable=true"
        - "traefik.http.routers.frontend.rule=Host(`arturscibor.pl`)"
        - "traefik.http.routers.frontend.entrypoints=websecure"
        - "traefik.http.routers.frontend.tls.certresolver=myresolver"
        - "traefik.http.services.frontend.loadbalancer.server.port=80"
        - "traefik.http.middlewares.frontend-retry.retry.attempts=2"
        - "traefik.http.routers.frontend.middlewares=frontend-retry"

networks:
  traefik-public:
    external: true
