version: '3.8'

services:
  # Nazwa serwisu w Swarmie to {stack}_{service} -> arturscibor_frontend_frontend
  frontend:
    # Obraz to sam nginx z gotowymi statykami — URL backendu jest wpieczony
    # w bundlu na etapie builda (src/app.ts). Zero env w runtime.
    image: ${FRONTEND_IMAGE:-arturscibor/arturscibor_frontend:latest}
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        # Traefik już działa na VPS (osobno od tego stacka) — front tylko
        # podpina się pod istniejącą sieć traefik-public.
        # Nazwy routera/serwisu/middleware MUSZĄ być unikalne w skali całego
        # providera Docker (Traefik nie namespace'uje ich per-stack) — inaczej
        # kolidują z project-job-server-FastAPI, który też ma tu "frontend",
        # i Traefik odrzuca router w całości ("defined multiple times").
        - "traefik.enable=true"
        - "traefik.http.routers.arturscibor-frontend.rule=Host(`arturscibor.pl`)"
        - "traefik.http.routers.arturscibor-frontend.entrypoints=websecure"
        - "traefik.http.routers.arturscibor-frontend.tls.certresolver=myresolver"
        - "traefik.http.routers.arturscibor-frontend.service=arturscibor-frontend"
        - "traefik.http.services.arturscibor-frontend.loadbalancer.server.port=80"
        - "traefik.http.middlewares.arturscibor-frontend-retry.retry.attempts=2"
        - "traefik.http.routers.arturscibor-frontend.middlewares=arturscibor-frontend-retry"

networks:
  traefik-public:
    external: true
